name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 说明：本项目完整依赖含 torch / transformers / paddleocr / chromadb 等重型包
      # （约 2GB+），在 CI 全量安装耗时且易因系统依赖失败。
      # 因此 CI 分两层：
      #   1) 全量语法编译检查（零第三方依赖，防止提交明显写坏的文件）
      #   2) 只跑不依赖模型/向量库的纯逻辑用例：test_runtime_guard（权限闸门）
      # 其余用例（pipeline、冲突消解、流式、集成）的导入链依赖向量库与模型，
      # 仍在本地全量执行。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Syntax check
        run: python -m compileall -q core rag utils reimbursement tools eval api.py app.py launcher.py main.py

      - name: Run tests
        run: python -m pytest tests/test_runtime_guard.py -v
